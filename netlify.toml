[build]
  publish = "peer-finance-manager/public"
  command = "node scripts/netlify-build-config.js"

# Security headers on every static page (the API sets its own in server.js).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://flexxforms.netlify.app https://*.flexxforms.netlify.app; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://flexxforms.netlify.app https://*.flexxforms.netlify.app https://api.stripe.com; frame-src 'self' https://flexxforms.netlify.app https://*.flexxforms.netlify.app https://checkout.stripe.com https://js.stripe.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
