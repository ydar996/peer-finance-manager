name: Dependency Audit

on:
  push:
    paths:
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Production deps only: `pkg` (devDependency) has an unfixed moderate
      # advisory and is a build-time tool, not part of the runtime image.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
